name: Validate Skill

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify repository structure and SKILL.md frontmatter
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path.cwd()
          required = [
              "SKILL.md",
              "README.md",
              "CHANGELOG.md",
              "agents/openai.yaml",
              "references/audit-workflow.md",
              "references/document-contract.md",
              "references/evidence-schema.md",
              "references/safe-operation.md",
              "scripts/inventory_project.py",
              "scripts/validate_audit_docs.py",
              "scripts/ci_smoke_test.py",
          ]
          missing = [path for path in required if not (root / path).is_file()]
          if missing:
              raise SystemExit(f"Missing required files: {', '.join(missing)}")

          skill_text = (root / "SKILL.md").read_text(encoding="utf-8")
          match = re.match(r"^---\r?\n(.*?)\r?\n---(?:\r?\n|$)", skill_text, re.DOTALL)
          if not match:
              raise SystemExit("SKILL.md does not contain valid YAML frontmatter boundaries")
          frontmatter = match.group(1)

          def value(name):
              found = re.search(rf"^{re.escape(name)}:\s*(.*?)\s*$", frontmatter, re.MULTILINE)
              return found.group(1).strip().strip("\\\"'") if found else ""

          if value("name") != "inaam-universal-software-auditor":
              raise SystemExit("SKILL.md name is incorrect")
          if not value("description"):
              raise SystemExit("SKILL.md description is empty")
          print("Repository structure and SKILL.md frontmatter are valid")
          PY

      - name: Compile Python scripts
        run: python -m py_compile scripts/*.py

      - name: Run helper smoke tests
        run: python scripts/ci_smoke_test.py
